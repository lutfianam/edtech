<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mail Merge Sekali Klik - Modul Web Interaktif Informatika Kelas X</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Audio Feedback -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            navy: '#1e3a8a',
                            royal: '#2563eb',
                            emerald: '#059669',
                            amber: '#d97706',
                            rose: '#e11d48'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f1f5f9; -webkit-tap-highlight-color: transparent; }
        .app-container {
            max-width: 480px;
            margin: 0 auto;
            background-color: #ffffff;
            min-height: 100vh;
            box-shadow: 0 0 20px rgba(0,0,0,0.08);
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .fade-in { animation: fadeIn 0.25s ease-in-out; }
        .slide-up { animation: slideUp 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { transform: translateY(15px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        
        /* Ribbon UI */
        .ribbon-tab {
            padding: 5px 10px;
            font-size: 11px;
            cursor: pointer;
            border-top-left-radius: 4px;
            border-top-right-radius: 4px;
            transition: all 0.15s;
        }
        .ribbon-tab.active {
            background-color: #ffffff;
            color: #1e3a8a;
            font-weight: 700;
            border-top: 2px solid #2563eb;
            border-left: 1px solid #cbd5e1;
            border-right: 1px solid #cbd5e1;
            margin-bottom: -1px;
            z-index: 10;
        }
        .ribbon-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 5px;
            border-radius: 4px;
            font-size: 10px;
            text-align: center;
            border: 1px solid transparent;
            cursor: pointer;
            user-select: none;
        }
        .ribbon-btn:active { background-color: #e2e8f0; }
        .ribbon-btn.disabled { opacity: 0.35; pointer-events: none; }
        .pulse-btn { animation: pulseBorder 1.5s infinite; }
        @keyframes pulseBorder {
            0% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0.6); }
            70% { box-shadow: 0 0 0 6px rgba(37, 99, 235, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 99, 235, 0); }
        }
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(15, 23, 42, 0.65);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; padding: 20px; backdrop-filter: blur(3px);
        }
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="font-sans antialiased text-slate-800">

<div class="app-container" id="app">
    <!-- Header App (Aligned with Wireframe Layar 1 & 2) -->
    <header class="bg-brand-navy text-white px-4 py-3 shadow-md z-30 sticky top-0 flex justify-between items-center border-b border-blue-900">
        <div class="flex items-center gap-2.5">
            <button id="btn-header-left" onclick="handleHeaderLeftClick()" class="w-8 h-8 rounded-lg bg-blue-900/60 hover:bg-blue-800 flex items-center justify-center text-white transition-colors">
                <i id="icon-header-left" class="fa-solid fa-bars text-sm"></i>
            </button>
            <div>
                <h1 class="font-bold text-xs sm:text-sm tracking-wide leading-tight" id="header-title">Mail Merge Sekali Klik</h1>
                <p class="text-[9px] text-blue-200" id="header-subtitle">Informatika Kelas X • SMA Islam Sudirman</p>
            </div>
        </div>
        <div class="flex items-center gap-2">
            <!-- Help Button (?) Presisi Wireframe -->
            <button onclick="showHelpModal()" title="Bantuan & Petunjuk" class="w-8 h-8 rounded-full bg-blue-800/80 hover:bg-blue-700 text-amber-300 font-bold text-xs flex items-center justify-center border border-blue-400/30 transition-all active:scale-95 shadow">
                <i class="fa-solid fa-circle-question text-base"></i>
            </button>
            <!-- Badge Counter Pill -->
            <div onclick="scrollToBadges()" class="cursor-pointer bg-blue-900/90 hover:bg-blue-800 rounded-full px-2.5 py-1 text-[11px] font-bold flex items-center gap-1.5 border border-amber-400/40 shadow-inner text-amber-300 transition-all">
                <i class="fa-solid fa-award text-amber-400 text-xs"></i>
                <span id="badge-count">0/6</span>
            </div>
        </div>
    </header>

    <!-- Progress Bar overall -->
    <div class="h-1.5 w-full bg-slate-200 sticky top-[53px] z-30">
        <div id="progress-bar" class="h-full bg-brand-royal transition-all duration-500 w-0"></div>
    </div>

    <!-- Container Utama Content -->
    <main id="main-content" class="flex-1 bg-slate-50 p-4 pb-24 overflow-y-auto relative">
        <!-- Views injected via JS -->
    </main>

    <!-- Global Modal Pop-up -->
    <div id="modal-container" class="hidden modal-overlay fade-in">
        <div class="bg-white rounded-2xl shadow-2xl p-6 max-w-xs w-full text-center slide-up border border-slate-100">
            <div id="modal-icon" class="text-5xl mb-3"></div>
            <h3 id="modal-title" class="text-lg font-bold text-brand-navy mb-1.5"></h3>
            <p id="modal-desc" class="text-xs text-slate-600 mb-5 leading-relaxed whitespace-pre-line"></p>
            <button id="modal-btn" class="w-full bg-brand-royal text-white font-semibold py-2.5 rounded-xl shadow hover:bg-blue-700 active:scale-[0.98] transition-all text-xs">
                Lanjutkan
            </button>
        </div>
    </div>

    <!-- Help & Guide Modal (?) -->
    <div id="help-modal" class="hidden modal-overlay fade-in">
        <div class="bg-white rounded-2xl shadow-2xl p-5 max-w-xs w-full slide-up border border-slate-100 relative">
            <button onclick="closeHelpModal()" class="absolute top-3 right-3 text-slate-400 hover:text-slate-600">
                <i class="fa-solid fa-xmark text-lg"></i>
            </button>
            <div class="flex items-center gap-2 text-brand-navy mb-3">
                <i class="fa-solid fa-circle-question text-xl text-amber-500"></i>
                <h3 class="font-bold text-sm">Pusat Bantuan & Petunjuk</h3>
            </div>
            <div id="help-content" class="text-xs text-slate-600 space-y-2.5 leading-relaxed">
                <!-- Injected contextually -->
            </div>
            <button onclick="closeHelpModal()" class="w-full mt-4 bg-brand-navy text-white font-semibold py-2 rounded-xl text-xs">
                Mengerti
            </button>
        </div>
    </div>
</div>

<script>
    // --- STATE MANAGEMENT SYSTEM ---
    const state = {
        progress: {
            unit0: false,
            unit1: false,
            unit2: false,
            unit3: false,
            unit4: false,
            unit5: false
        },
        unit0: { target: '', confidence: '', quizScore: null },
        unit1: { matchState: {}, quizScore: null },
        unit2: { errorsFixed: [], checklist: [false, false, false, false, false] },
        unit3: { step: 0, mistakes: 0, orderState: [] },
        unit4: { solvedCases: [false, false, false] },
        unit5: { checklist: [false, false, false, false], reflection: { plan: '', diff: '', action: '' } }
    };

    // Badge Definitions (Presisi Wireframe Lampiran A)
    const badgeDefs = [
        { id: 'unit0', name: 'Pelopor SRL', icon: 'fa-bullseye', color: 'from-purple-600 to-indigo-600', desc: 'Menetapkan target belajar & menyelesaikan diagnostik.' },
        { id: 'unit1', name: 'Paham 3 Komponen', icon: 'fa-puzzle-piece', color: 'from-indigo-600 to-blue-600', desc: 'Menguasai konsep Master Document, Data Source & Merge Field.' },
        { id: 'unit2', name: 'Ahli Data Excel', icon: 'fa-table', color: 'from-emerald-600 to-teal-600', desc: 'Memperbaiki tabel data Excel & format NIS text.' },
        { id: 'unit3', name: 'Master 7 Langkah', icon: 'fa-file-word', color: 'from-blue-600 to-cyan-600', desc: 'Menyelesaikan simulasi 7 langkah Mailings Word.' },
        { id: 'unit4', name: 'Dokter Mail Merge', icon: 'fa-stethoscope', color: 'from-amber-600 to-orange-600', desc: 'Menganalisis & memperbaiki 3 kasus gagal gabung.' },
        { id: 'unit5', name: 'Penguasaan Total', icon: 'fa-trophy', color: 'from-rose-600 to-pink-600', desc: 'Menyelesaikan proyek Hari Santri & refleksi SRL.' }
    ];

    let currentHelpKey = 'general';

    // Synthesize Sound Effects with Tone.js
    let synth = null;
    function playSound(type) {
        try {
            if (!synth) synth = new Tone.Synth().toDestination();
            Tone.start();
            if (type === 'success') {
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "8n", now);
                synth.triggerAttackRelease("G5", "8n", now + 0.15);
            } else if (type === 'error') {
                synth.triggerAttackRelease("A3", "8n");
            } else if (type === 'click') {
                synth.triggerAttackRelease("E5", "16n");
            } else if (type === 'badge') {
                const now = Tone.now();
                synth.triggerAttackRelease("C5", "16n", now);
                synth.triggerAttackRelease("E5", "16n", now + 0.1);
                synth.triggerAttackRelease("G5", "16n", now + 0.2);
                synth.triggerAttackRelease("C6", "8n", now + 0.3);
            }
        } catch(e) {}
    }

    // --- UNIT DATA DEFINITION ---
    const units = [
        { id: 'unit0', title: 'Mulai dari Sini', desc: '8 menit • Diagnostik & Target (SRL)', icon: 'fa-bullseye', color: 'text-purple-600', bg: 'bg-purple-100' },
        { id: 'unit1', title: 'Mengenal Mail Merge', desc: '10 menit • Konsep Dasar & 3 Komponen', icon: 'fa-puzzle-piece', color: 'text-indigo-600', bg: 'bg-indigo-100' },
        { id: 'unit2', title: 'Data Excel', desc: '12 menit • Struktur Tabel & Sumber Data', icon: 'fa-table', color: 'text-emerald-600', bg: 'bg-emerald-100' },
        { id: 'unit3', title: 'Dokumen & Merge Field', desc: '15 menit • Simulasi Word 7 Langkah', icon: 'fa-file-word', color: 'text-blue-600', bg: 'bg-blue-100' },
        { id: 'unit4', title: 'Pratinjau & Perbaikan', desc: '15 menit • Klinik Kesalahan (Troubleshoot)', icon: 'fa-stethoscope', color: 'text-amber-600', bg: 'bg-amber-100' },
        { id: 'unit5', title: 'Proyek & Refleksi', desc: '10 menit • Proyek Hari Santri & SRL', icon: 'fa-certificate', color: 'text-rose-600', bg: 'bg-rose-100' }
    ];

    // Helpers
    const mainContent = document.getElementById('main-content');
    const headerTitle = document.getElementById('header-title');
    const headerSubtitle = document.getElementById('header-subtitle');
    const progressBar = document.getElementById('progress-bar');
    const badgeCount = document.getElementById('badge-count');
    
    const modalContainer = document.getElementById('modal-container');
    const modalIcon = document.getElementById('modal-icon');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const modalBtn = document.getElementById('modal-btn');

    function updateHeader(title, subtitle, showBack = true, helpKey = 'general') {
        headerTitle.textContent = title;
        headerSubtitle.textContent = subtitle;
        currentHelpKey = helpKey;
        const iconLeft = document.getElementById('icon-header-left');
        if (showBack) {
            iconLeft.className = 'fa-solid fa-arrow-left text-sm';
        } else {
            iconLeft.className = 'fa-solid fa-bars text-sm';
        }
    }

    function handleHeaderLeftClick() {
        const iconLeft = document.getElementById('icon-header-left');
        if (iconLeft.classList.contains('fa-arrow-left')) {
            navigate('home');
        } else {
            showNavMenu();
        }
    }

    function showNavMenu() {
        playSound('click');
        showModal(
            '<i class="fa-solid fa-compass text-brand-royal text-5xl"></i>',
            'Peta Navigasi Modul',
            'Kamu dapat berpindah antar-unit pembelajaran kapan saja. Pilihlah unit dari daftar di Dashboard.',
            () => navigate('home')
        );
    }

    function updateProgress() {
        const completed = Object.values(state.progress).filter(Boolean).length;
        const total = 6;
        const percent = Math.round((completed / total) * 100);
        progressBar.style.width = `${percent}%`;
        badgeCount.textContent = `${completed}/${total}`;
    }

    function showModal(iconHTML, title, desc, onClick) {
        playSound('badge');
        modalIcon.innerHTML = iconHTML;
        modalTitle.textContent = title;
        modalDesc.textContent = desc;
        modalContainer.classList.remove('hidden');
        modalBtn.onclick = () => {
            modalContainer.classList.add('hidden');
            if (onClick) onClick();
        };
    }

    function showHelpModal() {
        playSound('click');
        const helpBox = document.getElementById('help-content');
        const helpModal = document.getElementById('help-modal');
        
        const guides = {
            general: `
                <p><strong>Mail Merge Sekali Klik</strong> adalah modul web interaktif Informatika Kelas X SMA Islam Sudirman Tembarak.</p>
                <ul class="list-disc pl-4 space-y-1 mt-1 text-[11px]">
                    <li>Selesaikan Unit 0 sampai 5 secara berurutan.</li>
                    <li>Kumpulkan 6 Lencana Penguasaan Kompetensi.</li>
                    <li>Manfaatkan tombol <em>Petunjuk</em> pada simulasi jika menemui kesulitan.</li>
                </ul>
            `,
            unit0: `
                <p><strong>Petunjuk Unit 0:</strong></p>
                <p>Jawab kuis diagnostik 5 soal untuk mengukur pemahaman awalmu, lalu pilih target belajar mandiri (SRL) hari ini.</p>
            `,
            unit1: `
                <p><strong>Petunjuk Unit 1:</strong></p>
                <p>Cocokkan 3 Komponen Mail Merge (Master Document = Word, Data Source = Excel, Merge Field = Penanda « »). Syarat lulus kuis minimal 4 dari 5 benar.</p>
            `,
            unit2: `
                <p><strong>Petunjuk Unit 2:</strong></p>
                <p>Klik pada sel bergaris merah berkedip di tabel Excel untuk memicu perbaikan otomatis (hapus baris judul atas, perbaiki NIS text, hapus baris kosong).</p>
            `,
            unit3: `
                <p><strong>Petunjuk Unit 3:</strong></p>
                <p>Ikuti simulasi 7 langkah Mail Merge pada pita menu Word. Jika salah mengeklik, tombol <em>Petunjuk</em> akan memberikan bantuan bertingkat (3 Level Scaffolding).</p>
            `,
            unit4: `
                <p><strong>Petunjuk Unit 4:</strong></p>
                <p>Analisislah 3 kasus gagal gabung Mail Merge dan tentukan diagnosis penyebab serta solusinya dengan tepat.</p>
            `,
            unit5: `
                <p><strong>Petunjuk Unit 5:</strong></p>
                <p>Lengkapi daftar periksa proyek pembuatan sertifikat Hari Santri secara berpasangan dan isi jurnal refleksi akhir SRL.</p>
            `
        };

        helpBox.innerHTML = guides[currentHelpKey] || guides.general;
        helpModal.classList.remove('hidden');
    }

    function closeHelpModal() {
        playSound('click');
        document.getElementById('help-modal').classList.add('hidden');
    }

    function scrollToBadges() {
        playSound('click');
        if (window.location.hash !== '#home') navigate('home');
        setTimeout(() => {
            document.getElementById('section-badges')?.scrollIntoView({ behavior: 'smooth' });
        }, 100);
    }

    function showBadgeDetail(badgeId) {
        playSound('click');
        const badge = badgeDefs.find(b => b.id === badgeId);
        const isUnlocked = state.progress[badgeId];
        
        if (isUnlocked) {
            showModal(
                `<div class="w-16 h-16 rounded-2xl bg-gradient-to-br ${badge.color} text-amber-300 flex items-center justify-center text-3xl mx-auto shadow-lg"><i class="fa-solid ${badge.icon}"></i></div>`,
                `Lencana: ${badge.name}`,
                `SELAMAT! Kamu telah menguasai lencana ini.\n\nKriteria Terpenuhi: ${badge.desc}`,
                null
            );
        } else {
            showModal(
                `<div class="w-16 h-16 rounded-2xl bg-slate-200 text-slate-400 flex items-center justify-center text-3xl mx-auto"><i class="fa-solid fa-lock"></i></div>`,
                `Lencana: ${badge.name} (Terkunci)`,
                `Selesaikan ${badge.name} pada unit terkait untuk membuka lencana ini!\n\nSyarat: ${badge.desc}`,
                () => navigate(badgeId)
            );
        }
    }

    function unlockUnit(unitId) {
        state.progress[unitId] = true;
        updateProgress();
    }

    // --- NAVIGATION CONTROLLER ---
    function navigate(view) {
        playSound('click');
        window.scrollTo(0,0);
        if (view === 'home') renderHome();
        else if (view === 'unit0') renderUnit0();
        else if (view === 'unit1') renderUnit1();
        else if (view === 'unit2') renderUnit2();
        else if (view === 'unit3') renderUnit3();
        else if (view === 'unit4') renderUnit4();
        else if (view === 'unit5') renderUnit5();
    }

    // ==========================================
    // 1. HOME DASHBOARD (PRESISE WIREFRAME LAYAR 1)
    // ==========================================
    function renderHome() {
        updateHeader('Mail Merge Sekali Klik', 'Peta Belajar Modul', false, 'general');
        const completedCount = Object.values(state.progress).filter(Boolean).length;
        const percent = Math.round((completedCount / 6) * 100);

        // Determine next recommended unit
        let nextUnitTitle = 'Unit 0: Mulai dari Sini';
        for (let i = 0; i < units.length; i++) {
            if (!state.progress[units[i].id]) {
                nextUnitTitle = `Unit ${i}: ${units[i].title}`;
                break;
            }
        }
        if (completedCount === 6) nextUnitTitle = 'Seluruh Unit Tuntas!';

        let html = `
            <div class="fade-in">
                <!-- Banner Target Belajar (Aligned Wireframe Layar 1) -->
                <div class="bg-gradient-to-r from-brand-navy to-brand-royal text-white p-4 rounded-2xl shadow-md mb-5 relative overflow-hidden">
                    <div class="relative z-10">
                        <span class="bg-blue-400/30 text-blue-100 text-[10px] font-bold px-2 py-0.5 rounded-full border border-blue-300/30 mb-2 inline-block">
                            Informatika Kelas X • Fase E
                        </span>
                        <h2 class="font-extrabold text-sm sm:text-base mb-1">Halo, siswa Kelas X-1!</h2>
                        <p class="text-xs text-blue-100 mb-2">Target hari ini: <span class="font-bold text-amber-300">${nextUnitTitle}</span></p>
                        
                        <!-- Progress Bar Wireframe -->
                        <div class="bg-black/20 p-2 rounded-xl backdrop-blur-sm border border-white/10 mt-3">
                            <div class="flex justify-between items-center text-[11px] font-bold mb-1">
                                <span class="text-blue-200">Kemajuan Modul</span>
                                <span class="text-amber-400">${percent}%</span>
                            </div>
                            <div class="w-full bg-blue-950/60 rounded-full h-2 overflow-hidden border border-blue-400/30">
                                <div class="bg-gradient-to-r from-amber-400 to-yellow-300 h-2 rounded-full transition-all duration-500" style="width: ${percent}%"></div>
                            </div>
                        </div>
                    </div>
                    <i class="fa-solid fa-envelope-open-text absolute -right-3 -bottom-3 text-7xl text-white/10"></i>
                </div>

                <!-- Unit List -->
                <h3 class="font-bold text-slate-800 text-xs uppercase tracking-wider mb-3 px-1 flex justify-between items-center">
                    <span>Daftar Unit Belajar</span>
                    <span class="text-[10px] text-slate-500 font-normal">Urut dari Unit 0</span>
                </h3>

                <div class="space-y-3">
        `;

        units.forEach((unit, index) => {
            const isCompleted = state.progress[unit.id];
            let statusBadge = `<div class="text-brand-royal text-xs font-bold bg-blue-50 px-2.5 py-1 rounded-lg border border-blue-200 shadow-sm flex items-center gap-1"><span>Lanjutkan</span> <i class="fa-solid fa-chevron-right text-[10px]"></i></div>`;
            let cardClass = 'bg-white border border-slate-200 shadow-sm hover:border-blue-400';
            let iconColor = unit.color;
            let iconBg = unit.bg;

            if (isCompleted) {
                statusBadge = `<div class="bg-emerald-100 text-emerald-700 font-bold px-2.5 py-1 rounded-lg text-xs flex items-center gap-1"><i class="fa-solid fa-check"></i> <span>Selesai</span></div>`;
                cardClass = 'bg-emerald-50/60 border border-emerald-200 shadow-sm';
                iconColor = 'text-emerald-700';
                iconBg = 'bg-emerald-100';
            }

            html += `
                <div onclick="navigate('${unit.id}')" class="flex items-center p-3.5 rounded-2xl ${cardClass} transition-all cursor-pointer active:scale-[0.99]">
                    <div class="w-11 h-11 rounded-xl ${iconBg} ${iconColor} flex items-center justify-center mr-3.5 shrink-0 shadow-inner">
                        <i class="fa-solid ${unit.icon} text-lg"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-xs text-slate-800 mb-0.5 truncate">Unit ${index}: ${unit.title}</h4>
                        <p class="text-[11px] text-slate-500 truncate">${unit.desc}</p>
                    </div>
                    <div class="ml-2 shrink-0">${statusBadge}</div>
                </div>
            `;
        });

        html += `
                </div>

                <!-- Seksi "Lencana Saya" (Presisi Wireframe Layar 1) -->
                <div id="section-badges" class="mt-6 bg-white p-4 rounded-2xl border border-slate-200 shadow-sm">
                    <div class="flex items-center justify-between mb-3">
                        <div class="flex items-center gap-2">
                            <div class="w-7 h-7 rounded-lg bg-amber-100 text-amber-600 flex items-center justify-center font-bold">
                                <i class="fa-solid fa-award text-sm"></i>
                            </div>
                            <div>
                                <h3 class="font-bold text-xs text-slate-800 uppercase tracking-wider">Lencana Saya</h3>
                                <p class="text-[10px] text-slate-500">6 Lencana Penguasaan Kompetensi</p>
                            </div>
                        </div>
                        <span class="text-xs font-extrabold text-amber-600 bg-amber-50 px-2.5 py-1 rounded-full border border-amber-200">${completedCount}/6 Terbuka</span>
                    </div>

                    <div class="grid grid-cols-2 gap-2.5">
        `;

        badgeDefs.forEach((badge, idx) => {
            const isUnlocked = state.progress[badge.id];
            if (isUnlocked) {
                html += `
                    <div onclick="showBadgeDetail('${badge.id}')" class="bg-gradient-to-br ${badge.color} text-white p-3 rounded-xl shadow-md border border-white/20 cursor-pointer hover:scale-[1.02] transition-transform relative overflow-hidden">
                        <div class="flex items-center justify-between mb-1">
                            <div class="w-7 h-7 rounded-lg bg-white/20 backdrop-blur-sm flex items-center justify-center text-amber-300 text-sm font-bold shadow-inner">

    function checkUnit1() {
        const m1 = document.getElementById('match-1').value;
        const m2 = document.getElementById('match-2').value;
        const m3 = document.getElementById('match-3').value;
        
        let quizScore = 0;
        for(let i=1; i<=5; i++) {
            const val = document.querySelector(`input[name="u1q${i}"]:checked`)?.value;
            if(val === 'correct') quizScore++;
        }

        if (m1 === 'B' && m2 === 'A' && m3 === 'C' && quizScore >= 4) {
            playSound('success');
            unlockUnit('unit1');
            showModal(
                '<i class="fa-solid fa-award text-indigo-600 text-6xl"></i>',
                'Lencana "Paham 3 Komponen" Terbuka!',
                `Kuis Formatif: ${quizScore}/5 benar. Pemahaman 3 Komponen tepat. Lencana Unit 1 terbuka!`,
                () => navigate('home')
            );
        } else {
            playSound('error');
            alert(`Skor Kuis: ${quizScore}/5. Ingat syarat lulus minimal 4/5 dan pencocokan komponen harus tepat (Master=Word, Data=Excel, Field=Penanda « »). Silakan perbaiki jawabanmu.`);

    }

            document.getElementById(`case-badge-${caseIdx}`).className = 'text-[10px] font-bold bg-emerald-100 text-emerald-700 px-2 py-0.5 rounded-full';

                unlockUnit('unit4');
                showModal(
                    '<i class="fa-solid fa-award text-amber-600 text-6xl"></i>',

                alert('Diagnosis tepat! Lanjutkan memecahkan kasus berikutnya.');
            }
        } else {
            playSound('error');
            alert('Diagnosis kurang tepat. Periksa kembali teori penyebab eror pada modul.');
        }
    }

    function updateProjectProgress() {
        playSound('click');
        const c0 = document.getElementById('pchk-0').checked;
        const c1 = document.getElementById('pchk-1').checked;
        const c2 = document.getElementById('pchk-2').checked;
        const c3 = document.getElementById('pchk-3').checked;
        state.unit5.checklist = [c0, c1, c2, c3];
    }

    function finishUnit5() {
        const r1 = document.getElementById('srl-ref-1').value;
        const r2 = document.getElementById('srl-ref-2').value;

        if (!r1 || !r2) {
            alert('Mohon isi Jurnal Refleksi singkat sebelum menyelesaikan modul.');
            return;
        }

        playSound('badge');
        unlockUnit('unit5');
        showModal(
            '<i class="fa-solid fa-trophy text-amber-500 text-6xl"></i>',
            'SELAMAT! MODUL TUNTAS 100%',

    window.onload = () => {
        renderHome();
